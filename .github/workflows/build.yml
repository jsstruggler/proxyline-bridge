name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-13]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        run: |
          pyinstaller proxyline-bridge.spec --clean -y
          if [[ "${{ matrix.os }}" == macos* ]]; then
            pip install dmgbuild
            dmgbuild -s dmg_settings.py "Proxyline Bridge" dist/ProxylineBridge.dmg
          fi
        shell: bash

      - name: Rename executable for release
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/proxyline-bridge.exe dist/proxyline-bridge-windows.exe
          elif [ "${{ matrix.os }}" = "windows-11-arm" ]; then
            mv dist/proxyline-bridge.exe dist/proxyline-bridge-windows-arm64.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            mv dist/ProxylineBridge.dmg dist/proxyline-bridge-macos-m-series.dmg
          elif [ "${{ matrix.os }}" = "macos-13" ]; then
            mv dist/ProxylineBridge.dmg dist/proxyline-bridge-macos-intel.dmg
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mv dist/proxyline-bridge dist/proxyline-bridge-linux-amd64
          elif [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            mv dist/proxyline-bridge dist/proxyline-bridge-linux-arm64
          else
            mv dist/proxyline-bridge dist/proxyline-bridge-linux
          fi
        shell: bash

      - name: Package Linux DEB
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            ARCH="amd64"
            BIN_NAME="proxyline-bridge-linux-amd64"
          else
            ARCH="arm64"
            BIN_NAME="proxyline-bridge-linux-arm64"
          fi
          
          VERSION=$(grep "CURRENT_VERSION =" main.py | cut -d'"' -f2 | head -n1)
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          
          PKG_DIR="proxyline-bridge_${VERSION}_${ARCH}"
          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/usr/bin
          mkdir -p ${PKG_DIR}/usr/share/applications
          mkdir -p ${PKG_DIR}/usr/share/pixmaps
          
          cp dist/${BIN_NAME} ${PKG_DIR}/usr/bin/proxyline-bridge
          chmod +x ${PKG_DIR}/usr/bin/proxyline-bridge
          cp linux/proxyline-bridge.desktop ${PKG_DIR}/usr/share/applications/
          cp linux/proxyline-bridge.png ${PKG_DIR}/usr/share/pixmaps/
          
          cat <<EOF > ${PKG_DIR}/DEBIAN/control
          Package: proxyline-bridge
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: Proxyline
          Description: Proxyline Bridge local server
          EOF
          
          dpkg-deb --build ${PKG_DIR}
          mv ${PKG_DIR}.deb dist/
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxyline-bridge-${{ matrix.os }}
          path: dist/proxyline-bridge-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/proxyline-bridge-*
